[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "neurosonancy"
version = "2.1.0"
description = "Toolkit TUI para clonagem, treinamento e leitura de textos com múltiplos backends TTS"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "sounddevice>=0.4.6",
    "python-dotenv>=1.0.0",
    "webrtcvad>=2.0.10",
    "faster-whisper>=1.0.0",
    "elevenlabs>=1.0.0",
    "typer>=0.9.0",
    "pydub>=0.25.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "dbus-next>=0.2.3",
    "psutil>=5.9.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "chardet>=5.0.0",
]

[project.scripts]
neurosonancy = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
